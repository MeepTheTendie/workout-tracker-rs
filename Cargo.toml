[package]
name = "workout-tracker-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
subtle = "2"
hex = "0.4"
url = "2"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
